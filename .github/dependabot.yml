version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 15
    ignore:
      # Shai-Hulud supply chain attack (2026-08-04): malicious versions published.
      # Remove these ignores once clean patched versions are confirmed safe.
      - dependency-name: "keyv"
        versions: ["6.0.0"]
      - dependency-name: "@keyv/*"
        versions: ["6.0.0"]
      - dependency-name: "cache-manager"
        versions: [">= 7.2.10"]
      - dependency-name: "@cacheable/utils"
        versions: [">= 2.5.1"]
      - dependency-name: "cacheable"
        versions: [">= 2.5.1"]
      - dependency-name: "@cacheable/memory"
        versions: [">= 2.2.1"]
      - dependency-name: "@cacheable/node-cache"
        versions: [">= 3.1.2"]
      - dependency-name: "@cacheable/net"
        versions: [">= 2.1.1"]
      - dependency-name: "flat-cache"
        versions: ["6.1.24"]
      - dependency-name: "file-entry-cache"
        versions: ["11.1.6"]
      - dependency-name: "cacheable-request"
        versions: ["13.0.20"]
      - dependency-name: "ecto"
        versions: [">= 5.0.1"]
    groups:
      hiero-sdk:
        patterns:
          - "@hiero-ledger/*"
      nestjs:
        patterns:
          - "@nestjs/*"
          - "@nest-lab/*"
      electron:
        patterns:
          - "electron"
          - "electron-*"
          - "vite-plugin-electron"
          - "@electron-toolkit/*"
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "@vitejs/plugin-vue"
          - "pinia"
          - "@pinia/*"
          - "@vueuse/*"
          - "@vuepic/*"
          - "eslint-plugin-vue"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
          - "better-sqlite3"
          - "@types/better-sqlite3"
      redis-cache:
        patterns:
          - "ioredis"
          - "redis"
          - "cache-manager"
          - "cache-manager-*"
          - "murlock"
      messaging:
        patterns:
          - "amqp-connection-manager"
          - "amqplib"
          - "nats"
      testing:
        patterns:
          - "jest"
          - "ts-jest"
          - "jest-*"
          - "jest-mock-extended"
          - "testcontainers"
          - "@testcontainers/*"
          - "supertest"
          - "@types/jest"
          - "@types/supertest"
          - "@hashgraph/hedera-local"
          - "@nestjs/testing"
          - "vitest"
          - "@vitest/*"
      playwright:
        patterns:
          - "playwright"
          - "playwright-*"
          - "playwright-core"
          - "@playwright/*"
      build-tools:
        patterns:
          - "vite"
          - "vite-*"
          - "typescript"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "prettier"
          - "@nestjs/cli"
          - "@nestjs/schematics"
          - "webpack"
          - "webpack-cli"
          - "ts-loader"
          - "tsx"
          - "sass"
