# SPDX-License-Identifier: Apache-2.0

name: Security

on:
  pull_request:
    branches:
      - main
      - release/**
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  LC_ALL: C.UTF-8

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: pr-checks-${{ github.workflow }}-${{ github.head_ref || github.run_id }}

jobs:
  codeql:
    if: github.ref == 'refs/heads/main'
    name: CodeQL
    runs-on: transaction-tools-linux-medium
    permissions:
      security-events: write  # Required for uploading SARIF
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          build-mode: none
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript"

  pnpm-audit:
    name: PNPM Audit
    runs-on: transaction-tools-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Audit Dependencies
        run: |
          # --ignore-unfixable silences advisories whose patched version does not exist on
          # npm yet (nothing to install even if we wanted to fix it).
          #
          # For supply-chain attacks where a fix version EXISTS but is itself malicious,
          # suppress the advisory by GHSA ID.  Keep each entry in sync with the matching
          # override in pnpm-workspace.yaml and the ignore rule in .github/dependabot.yml.
          # Remove the flag once a clean patched version is confirmed safe.
          # Template (add one --ignore per affected advisory):
          #   --ignore GHSA-xxxx-xxxx-xxxx  # pkg >=bad.ver — attack date, brief note
          pnpm audit --audit-level=high --ignore-unfixable

  semgrep:
    if: github.ref == 'refs/heads/main'
    name: Semgrep
    permissions:
      security-events: write  # Required for uploading SARIF
    runs-on: transaction-tools-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: pip install semgrep==1.168.0

      - name: Run Semgrep
        run: semgrep scan --error --sarif --output semgrep.sarif

      - name: Upload SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: semgrep
          sarif_file: semgrep.sarif
