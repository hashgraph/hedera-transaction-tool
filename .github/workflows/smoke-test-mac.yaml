name: macOS Smoke Test

# Validates the signing and notarization pipeline against any branch or tag
# in this repository (not pull request refs or fork commits) without creating
# a release. Use this to confirm secrets/certs are working before cutting a
# release, or to debug electron-builder config changes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag in this repository to build from"
        required: false
        default: main

defaults:
  run:
    shell: bash

env:
  LC_ALL: C.UTF-8

jobs:
  smoke_test_mac:
    name: macOS Smoke Test
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Validate ref is a branch or tag in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          if [[ ! "${REF}" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "${REF}" == -* ]] || [[ "${REF}" == *..* ]]; then
            echo "::error::Invalid ref '${REF}'. Refs may only contain letters, numbers, '.', '_', '-', and '/'." >&2
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/branches/${REF}" >/dev/null 2>&1; then
            echo "ref '${REF}' is a branch in this repository"
          elif gh api "repos/${{ github.repository }}/git/ref/tags/${REF}" >/dev/null 2>&1; then
            echo "ref '${REF}' is a tag in this repository"
          else
            echo "::error::Refusing to build ref '${REF}'. This workflow only builds branches and tags that exist in this repository (not pull request refs or fork commits), because the job has access to production code-signing and notarization secrets." >&2
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.HEDERA_BOT_TOKEN }}
          persist-credentials: false

      - name: Install pnpm
        uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version-file: package.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Prepare App Store Connect API Key
        run: |
          API_KEY_PATH="${RUNNER_TEMP}/apple_api_key.p8"
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "${API_KEY_PATH}"
          echo "APPLE_API_KEY=${API_KEY_PATH}" >> "$GITHUB_ENV"

      - name: Verify Apple Notarization Credentials
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool history \
            --key "${APPLE_API_KEY}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER}"

      - name: Install Dependencies
        working-directory: front-end
        run: pnpm install --frozen-lockfile

      - name: Build and Sign macOS Artifacts
        working-directory: front-end
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_APP_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_APP_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MACOS_CERT_INSTALLER_BASE64 }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MACOS_CERT_INSTALLER_PASSWORD }}
        run: pnpm run build && pnpm exec electron-builder --mac --publish=never

      - name: Notarize and Staple Installers
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash .github/scripts/notarize-mac-installers.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-macos-artifacts
          path: |
            front-end/release/*.dmg
            front-end/release/*.pkg
            front-end/release/*.zip
            front-end/release/*.blockmap
            front-end/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 3
