virtualStoreDirMaxLength: 60
shamefullyHoist: true
trustLockfile: true

# typeorm@1.1.0 declares an optional ioredis peer pinned to ^5.0.4; nothing in
# this repo uses typeorm's built-in ioredis query cache, but without this rule
# pnpm splits typeorm into two incompatible instances (one peer-linked to our
# direct ioredis@6 dep, one falling back to typeorm's ^5.0.4 default), which
# breaks cross-workspace typescript compilation.
peerDependencyRules:
  allowedVersions:
    'typeorm>ioredis': '6'

packages:
  - back-end
  - back-end/apps/*
  - back-end/typeorm
  - front-end
  - automation

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  bcrypt: true
  better-sqlite3: true
  cpu-features: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
  vue-demi: true

catalog:
  '@eslint/eslintrc': 3.3.7
  '@eslint/js': 10.0.1
  '@typescript-eslint/eslint-plugin': 8.72.0
  '@typescript-eslint/parser': 8.72.0
  '@hiero-ledger/proto': 2.32.0
  '@hiero-ledger/sdk': 2.90.1
  '@types/bcrypt': 6.0.0
  '@types/better-sqlite3': 9.6.0
  '@types/jest': 30.0.0
  '@types/node': 26.6.5
  '@types/semver': 7.8.0
  argon2: 0.45.1
  axios: 1.20.0
  bcrypt: 6.0.0
  bcryptjs: 3.0.3
  better-sqlite3: 13.0.3
  dotenv: 18.0.9
  eslint: 10.13.0
  jest: 30.5.2
  jszip: 3.10.2
  long: 5.3.2
  pg: 8.23.1
  prettier: 3.9.10
  reflect-metadata: 0.2.2
  semver: 7.8.5
  ts-jest: 29.4.15
  ts-loader: 9.6.2
  ts-node: 10.9.2
  typeorm: 1.1.0
  typescript: 6.0.3

catalogs:
  # @nestjs/* packages from the nest monorepo (nestjs/nest) ship together and
  # always share a version. The YAML anchor (&nestjsCore / *nestjsCore) keeps
  # the version literal in one place — change it once on Nest upgrades.
  # Do NOT add independently-versioned packages here (e.g. @nestjs/jwt,
  # @nestjs/passport, @nestjs/config, @nestjs/swagger) — their version match
  # is coincidental.
  nestjs-core:
    '@nestjs/common': &nestjsCore 11.2.7
    '@nestjs/core': *nestjsCore
    '@nestjs/microservices': *nestjsCore
    '@nestjs/platform-express': *nestjsCore
    '@nestjs/platform-socket.io': *nestjsCore
    '@nestjs/testing': *nestjsCore
    '@nestjs/websockets': *nestjsCore

  # testcontainers/* packages ship together and always share a version.
  testcontainers:
    testcontainers: &testcontainersVersion 11.14.0
    '@testcontainers/postgresql': *testcontainersVersion
    '@testcontainers/rabbitmq': *testcontainersVersion
    '@testcontainers/redis': *testcontainersVersion

  # vitest/* packages ship together and always share a version.
  vitest:
    vitest: &vitestVersion 4.1.12
    '@vitest/coverage-v8': *vitestVersion

overrides:
  "@prisma/adapter-better-sqlite3>better-sqlite3": "catalog:"
  "protobufjs@<8.0.0": "7.6.5"
  "protobufjs@>=8.0.0": "8.7.1"
  "serialize-javascript": "7.1.4"
  "js-yaml": "5.4.3"
  "fast-uri": "3.1.9"
  "diff@<5.2.2": "5.2.2"
  "diff@>=6.0.0": "8.0.3"
  "ws@>=8.0.0": "8.21.0"
  "undici@>=7.0.0": "7.30.1"
  "uuid@<11.1.1": "11.1.1"
  "flat-cache@6.1.24": "4.0.1"
  "undici@<7.0.0": "6.29.1"
  "image-size": "2.0.4"
  "multer": "2.5.0"
  "mysql2": "3.24.5"
  "node-abi": "4.38.0"
  "body-parser": "2.4.0"
  "follow-redirects": "1.16.1"

# Refuse to resolve packages published fewer than 3 days ago (4320 minutes)
# This blocks supply-chain attacks that race to publish malicious versions.
# Add a specific package@version to minimumReleaseAgeExclude only after
# confirming it is safe (e.g. a trusted patch that is legitimately new).
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # 1.4.1 fixes GHSA-86w9-cpqp-85rv (RSA-PKCS signature forgery via extra
  # nested DigestAlgorithm elements); 1.4.2 fixes a pem.decode() regression
  # from 1.4.1. Confirmed via upstream changelog.
  - node-forge@1.4.2
